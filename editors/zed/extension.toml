id = "weby"
name = "Weby"
description = "Weby language support: syntax highlighting, outline, indentation, run buttons, and the `weby lsp` language server."
version = "0.1.0"
schema_version = 1
authors = ["Weby contributors"]
repository = "https://github.com/SammyThorne/new_language"

# The grammar lives in this repository, in editors/tree-sitter-weby. Zed clones the repository at
# this commit to build it. While the repository is private, `./install-local.sh` makes a copy
# that points at your checkout instead.
[grammars.weby]
repository = "https://github.com/SammyThorne/new_language"
rev = "702a1b8be63c8c3bf9355339929c5d4507da363f"
path = "editors/tree-sitter-weby"

[language_servers.weby]
name = "Weby Language Server"
languages = ["Weby"]
