id = "viper"
name = "Viper"
description = "Viper language support: syntax highlighting, outline, indentation, run buttons, and the `viper lsp` language server."
version = "1.1.0"
schema_version = 1
authors = ["Viper contributors"]
repository = "https://github.com/SammyThorne/new_language"

# The grammar lives in this repository, in editors/tree-sitter-viper. Zed clones the repository at
# this commit to build it. While the repository is private, `./install-local.sh` makes a copy
# that points at your checkout instead.
[grammars.viper]
repository = "https://github.com/SammyThorne/new_language"
rev = "d8661c26334942b8cdb79ef8ce4d47ec57016416"
path = "editors/tree-sitter-viper"

[language_servers.viper]
name = "Viper Language Server"
languages = ["Viper"]
