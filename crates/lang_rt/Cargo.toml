[package]
name = "lang_rt"
description = "The runtime library linked into every compiled program"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib"]

[dependencies]
lang_names.workspace = true
lang_format.workspace = true
regex-lite = "0.1.9"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.12"
ring = "0.17.14"
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
